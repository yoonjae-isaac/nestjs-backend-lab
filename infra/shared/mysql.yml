services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: backend_lab
      MYSQL_PASSWORD: lab
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lab
      TZ: UTC
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -proot --silent']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
