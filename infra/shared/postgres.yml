services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend_lab
      POSTGRES_PASSWORD: lab
      POSTGRES_USER: lab
    command: ['postgres', '-c', 'timezone=UTC']
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d backend_lab']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
