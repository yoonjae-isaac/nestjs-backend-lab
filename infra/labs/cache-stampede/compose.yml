services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/labs/cache-stampede/apps/gateway/main.js']
    environment:
      CACHE_STAMPEDE_BASE_TTL_MS: '${CACHE_STAMPEDE_BASE_TTL_MS:-1200}'
      CACHE_STAMPEDE_JITTER_MS: '${CACHE_STAMPEDE_JITTER_MS:-500}'
      CACHE_STAMPEDE_LOCK_RETRY_MS: '${CACHE_STAMPEDE_LOCK_RETRY_MS:-25}'
      CACHE_STAMPEDE_LOCK_TTL_MS: '${CACHE_STAMPEDE_LOCK_TTL_MS:-4000}'
      CACHE_STAMPEDE_LOCK_WAIT_MS: '${CACHE_STAMPEDE_LOCK_WAIT_MS:-4000}'
      CACHE_STAMPEDE_ORIGIN_DELAY_MS: '${CACHE_STAMPEDE_ORIGIN_DELAY_MS:-150}'
      CACHE_STAMPEDE_REFRESH_AHEAD_MS: '${CACHE_STAMPEDE_REFRESH_AHEAD_MS:-500}'
      CACHE_STAMPEDE_STALE_MS: '${CACHE_STAMPEDE_STALE_MS:-2000}'
      LOG_LEVEL: info
      POSTGRES_ENABLED: 'true'
      POSTGRES_POOL_MAX: '${POSTGRES_POOL_MAX:-20}'
      POSTGRES_URL: postgresql://lab:lab@postgres:5432/backend_lab
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    volumes:
      - ./infra/labs/cache-stampede/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
