x-saga-environment: &saga-environment
  KAFKA_BROKERS: kafka:29092
  KAFKA_CLIENT_ID: backend-lab.saga-pattern
  KAFKA_ENABLED: 'true'
  LOG_LEVEL: info
  NODE_ENV: production
  POSTGRES_ENABLED: 'true'
  POSTGRES_POOL_MAX: '10'
  POSTGRES_URL: postgresql://lab:lab@postgres:5432/backend_lab
  SAGA_ENABLED: 'true'
  SAGA_OUTBOX_LEASE_MS: '${SAGA_OUTBOX_LEASE_MS:-10000}'
  SAGA_OUTBOX_POLL_MS: '${SAGA_OUTBOX_POLL_MS:-50}'

x-saga-worker: &saga-worker
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    app:
      condition: service_healthy
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
  environment: *saga-environment
  healthcheck:
    disable: true
  restart: unless-stopped

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/labs/saga-pattern/apps/gateway/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-gateway
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  saga-order:
    <<: *saga-worker
    command: ['node', 'dist/labs/saga-pattern/apps/domain-service/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-order
      SAGA_SERVICE_ROLE: ORDER

  saga-inventory:
    <<: *saga-worker
    command: ['node', 'dist/labs/saga-pattern/apps/domain-service/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-inventory
      SAGA_SERVICE_ROLE: INVENTORY

  saga-payment:
    <<: *saga-worker
    command: ['node', 'dist/labs/saga-pattern/apps/domain-service/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-payment
      SAGA_SERVICE_ROLE: PAYMENT

  saga-shipping:
    <<: *saga-worker
    command: ['node', 'dist/labs/saga-pattern/apps/domain-service/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-shipping
      SAGA_SERVICE_ROLE: SHIPPING

  saga-orchestrator:
    <<: *saga-worker
    command: ['node', 'dist/labs/saga-pattern/apps/orchestrator/main.js']
    environment:
      <<: *saga-environment
      INSTANCE_ID: saga-orchestrator
      SAGA_SERVICE_ROLE: ORCHESTRATOR

  nginx:
    volumes:
      - ./infra/labs/saga-pattern/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
